<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>뮤엠영어 Kids</title>
<meta name="description" content="뮤엠영어 Kids 학습 콘텐츠 뷰어">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="16x16">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="뮤엠Kids">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="page">

  <!-- 좌측(세로: 상단) 패널 -->
  <header class="left-panel">

    <h1 class="logo-wrap">
      <img class="logo" src="./icons/logo.png" alt="뮤엠영어 Kids" width="1156" height="349">
    </h1>

    <div class="selector-row">
      <!-- 나이 -->
      <div class="dropdown" id="age-dd">
        <button type="button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="나이 선택">
          <span class="age-pill" data-display></span>
          <span class="arrow" aria-hidden="true">▼</span>
        </button>
        <ul class="dropdown-panel" role="listbox" aria-label="나이"></ul>
      </div>

      <!-- 카테고리 -->
      <div class="dropdown" id="cat-dd">
        <button type="button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="카테고리 선택">
          <span class="cat-pill" data-display></span>
          <span class="arrow" aria-hidden="true">▼</span>
        </button>
        <ul class="dropdown-panel" role="listbox" aria-label="카테고리"></ul>
      </div>

      <!-- Volume + 이전/다음 -->
      <div class="vol-row">
        <button type="button" class="nav-btn" id="prev-vol" aria-label="이전 Vol">◀</button>
        <div class="dropdown" id="vol-dd">
          <button type="button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Vol 선택">
            <span class="vol-pill" data-display></span>
            <span class="arrow" aria-hidden="true">▼</span>
          </button>
          <ul class="dropdown-panel" role="listbox" aria-label="Vol"></ul>
        </div>
        <button type="button" class="nav-btn" id="next-vol" aria-label="다음 Vol">▶</button>
      </div>
    </div>

    <!-- 가로 크기 조절 (가로 모드에서만 표시) -->
    <div class="width-ctrl">
      <button type="button" id="width-down" title="축소" aria-label="화면 폭 축소">−</button>
      <span class="size-label" id="size-label" aria-live="polite">100%</span>
      <button type="button" id="width-up" title="확대" aria-label="화면 폭 확대">+</button>
    </div>

    <button type="button" class="install-btn" id="install-btn" hidden>앱 설치</button>

  </header>

  <!-- 콘텐츠 영역 -->
  <main class="iframe-area">
    <div class="iframe-box">
      <iframe id="viewer" title="뮤엠영어 Kids 콘텐츠" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div class="offline-overlay" id="offline-overlay" hidden>
        <div class="big">오프라인</div>
        <div class="sub">인터넷 연결이 필요합니다.<br>연결되면 자동으로 다시 불러옵니다.</div>
      </div>
    </div>
  </main>

</div>

<!-- iOS 설치 안내 -->
<div class="modal" id="ios-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ios-modal-title">
    <h2 id="ios-modal-title">홈 화면에 추가하기</h2>
    <p>Safari 하단의 <b>공유</b> 버튼을 누른 뒤<br><b>홈 화면에 추가</b>를 선택하세요.</p>
    <button type="button" id="ios-modal-close">확인</button>
  </div>
</div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
